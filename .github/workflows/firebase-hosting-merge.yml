name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar environment.ts desde secrets
        run: |
          cat > src/environments/environment.ts << EOF
          export const environment = {
            production: false,
            firebase: {
              apiKey:            '${{ secrets.FIREBASE_API_KEY }}',
              authDomain:        '${{ secrets.FIREBASE_AUTH_DOMAIN }}',
              projectId:         '${{ secrets.FIREBASE_PROJECT_ID }}',
              storageBucket:     '${{ secrets.FIREBASE_STORAGE_BUCKET }}',
              messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}',
              appId:             '${{ secrets.FIREBASE_APP_ID }}',
            },
            footballApiKey:  '${{ secrets.FOOTBALL_API_KEY }}',
            footballApiUrl:  'https://api.football-data.org/v4',
            competitionCode: 'WC',
          };
          EOF

      - name: Generar environment.prod.ts desde secrets
        run: |
          cat > src/environments/environment.prod.ts << EOF
          export const environment = {
            production: true,
            firebase: {
              apiKey:            '${{ secrets.FIREBASE_API_KEY }}',
              authDomain:        '${{ secrets.FIREBASE_AUTH_DOMAIN }}',
              projectId:         '${{ secrets.FIREBASE_PROJECT_ID }}',
              storageBucket:     '${{ secrets.FIREBASE_STORAGE_BUCKET }}',
              messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}',
              appId:             '${{ secrets.FIREBASE_APP_ID }}',
            },
            footballApiKey:  '${{ secrets.FOOTBALL_API_KEY }}',
            footballApiUrl:  'https://api.football-data.org/v4',
            competitionCode: 'WC',
          };
          EOF

      - run: npm ci && npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WORLD_CUP_PREDICTOR_C431D }}
          channelId: live
          projectId: world-cup-predictor-c431d
